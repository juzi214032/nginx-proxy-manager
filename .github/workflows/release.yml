name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true

jobs:
  docker:
    name: Build and push docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build frontend
        run: |
          docker run --rm \
            -e CI=true \
            -e NODE_OPTIONS=--openssl-legacy-provider \
            -v "$(pwd)/frontend:/app/frontend" \
            -w /app/frontend \
            nginxproxymanager/nginx-full:certbot-node \
            sh -c "yarn install && yarn locale-compile && yarn build && chown -R $(id -u):$(id -g) /app/frontend"

      - id: build-date
        run: echo "date=$(date '+%Y-%m-%d %T %Z')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BUILD_VERSION=${{ github.event.inputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          # 需要 arm64 镜像时改为 linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/juzi214032/nginx-proxy-manager:${{ github.event.inputs.version }}
            registry.cn-hangzhou.aliyuncs.com/juzi214032/nginx-proxy-manager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
